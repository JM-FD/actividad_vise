name: Azure Continuous Delivery - JohanLopez

on:
  workflow_dispatch:
    inputs:
      IMAGE_REPOSITORY:
        description: 'Repository of the image (same as declared in App Service creation)'
        required: true
        default: 'api-vise'
      IMAGE_TAG:
        description: 'Tag of the image'
        required: true
        default: 'latest'
      AZURE_WEBAPP_NAME:
        description: 'Nombre del App Service creado en Azure'
        required: true
      PORT:
        description: 'Port of the application'
        required: true
        default: '443'

env:
  IMAGE_URL: ${{ secrets.ACR_NAME_JOHAN_LOPEZ }}.azurecr.io/${{ github.event.inputs.IMAGE_REPOSITORY }}:${{ github.event.inputs.IMAGE_TAG }}

jobs:
  build-and-push-image:
    name: 'Build and Push to ACR'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_NAME_JOHAN_LOPEZ }}.azurecr.io
          username: ${{ secrets.ACR_NAME_JOHAN_LOPEZ }}
          password: ${{ secrets.ACR_PASSWORD_JOHAN_LOPEZ }}

      - name: Build and Push to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_URL }}

  deploy:
    name: 'Deploy remote container to Azure'
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Deploy to Azure Web App for Container
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ github.event.inputs.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEB_APP_PUBLISH_PROFILE_JOHAN_LOPEZ }}
          images: ${{ env.IMAGE_URL }}

  test-deploy:
    name: 'Test deployed service'
    runs-on: ubuntu-latest
    needs: [build-and-push-image, deploy]
    steps:
      - name: Checkout session.hurl
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            session.hurl
          sparse-checkout-cone-mode: false

      - name: Setup hurl (API testing tool)
        uses: gacts/install-hurl@v1

      - name: Install dnsutils and curl
        run: |
          sudo apt-get update -y
          sudo apt-get install -y dnsutils curl

      - name: Wait for DNS to resolve and service to be reachable
        env:
          APP_HOST: ${{ github.event.inputs.AZURE_WEBAPP_NAME }}.azurewebsites.net
          APP_PORT: ${{ github.event.inputs.PORT }}
          MAX_RETRIES: 12
        run: |
          set -euo pipefail
          host="${APP_HOST}"
          port="${APP_PORT}"
          max_retries=${MAX_RETRIES}
          attempt=0

          echo "Checking DNS resolution and HTTPS reachability for: $host:$port"
          while [ $attempt -lt $max_retries ]; do
            attempt=$((attempt+1))
            echo "Attempt $attempt/$max_retries — checking DNS..."
            if nslookup "$host" >/dev/null 2>&1; then
              echo "DNS resolved for $host"
              echo "Checking HTTPS response on https://$host:$port ..."
              # Try a HEAD request (follow redirects) and accept 2xx/3xx
              if curl --head --location --silent --show-error --max-time 10 "https://$host:$port/" >/dev/null 2>&1; then
                echo "HTTP(S) reachable for https://$host:$port"
                break
              else
                echo "Host resolves but service not yet responding on https://$host:$port"
              fi
            else
              echo "DNS did not resolve yet for $host"
            fi

            # exponential backoff with cap
            sleep_seconds=$((2 ** attempt))
            if [ $sleep_seconds -gt 60 ]; then
              sleep_seconds=60
            fi
            echo "Sleeping $sleep_seconds seconds before retry..."
            sleep $sleep_seconds
          done

          if [ $attempt -ge $max_retries ]; then
            echo "ERROR: Could not resolve or reach https://$host:$port after $max_retries attempts"
            exit 1
          fi

      - name: Test API with hurl
        run: |
          hurl \
            --variable host=https://${{ github.event.inputs.AZURE_WEBAPP_NAME }}.azurewebsites.net:${{ github.event.inputs.PORT }} \
            --connect-timeout 20s \
            --error-format long \
            --verbose \
            --test session.hurl
