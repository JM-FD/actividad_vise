name: Azure Continuous Delivery - JOHANLOPEZ

on:
  workflow_dispatch:
    inputs:
      IMAGE_REPOSITORY:
        description: 'Repository of the image (same as declared in App Service creation)'
        required: true
        default: 'api-vise'
      IMAGE_TAG:
        description: 'Tag of the image'
        required: true
        default: 'latest'
      AZURE_WEBAPP_NAME:
        description: 'Nombre del App Service creado en Azure'
        required: true
      PORT:
        description: 'Port of the application'
        required: true
        default: '443'

env:
  # Construye la URL completa de la imagen: <ACR_NAME>.azurecr.io/<repo>:<tag>
  IMAGE_URL: ${{ secrets.ACR_NAME }}.azurecr.io/${{ github.event.inputs.IMAGE_REPOSITORY }}:${{ github.event.inputs.IMAGE_TAG }}

jobs:
  build-and-push-image:
    name: Build and Push to ACR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME || secrets.ACR_NAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_URL }}

  deploy:
    name: Deploy remote container to Azure
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Login to Azure (using service principal)
        if: ${{ secrets.AZURE_CREDENTIALS }}
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Web App to pull from ACR (set registry creds)
        if: ${{ secrets.AZURE_CREDENTIALS }}
        uses: azure/cli@v1
        with:
          inlineScript: |
            az webapp config container set \
              --name ${{ github.event.inputs.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --docker-custom-image-name ${{ env.IMAGE_URL }} \
              --docker-registry-server-url https://${{ secrets.ACR_NAME }}.azurecr.io \
              --docker-registry-server-user ${{ secrets.ACR_USERNAME || secrets.ACR_NAME }} \
              --docker-registry-server-password "${{ secrets.ACR_PASSWORD }}"
      - name: Deploy (via azure/webapps-deploy) — using service principal path
        if: ${{ secrets.AZURE_CREDENTIALS }}
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ github.event.inputs.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE_URL }}

      - name: Deploy (via publish-profile) — fallback if no AZURE_CREDENTIALS
        if: ${{ !secrets.AZURE_CREDENTIALS && secrets.AZURE_WEBAPP_PUBLISH_PROFILE_HARRIZON }}
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ github.event.inputs.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_HARRIZON }}
          images: ${{ env.IMAGE_URL }}

  test-deploy:
    name: Test deployed service
    runs-on: ubuntu-latest
    needs: [build-and-push-image, deploy]
    steps:
      - name: Checkout session.hurl
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            session.hurl
          sparse-checkout-cone-mode: false

      - name: Setup hurl (API testing tool)
        uses: gacts/install-hurl@v1

      - name: Test API
        run: |
          hurl \
            --variable host=https://${{ github.event.inputs.AZURE_WEBAPP_NAME }}.azurewebsites.net:${{ github.event.inputs.PORT }} \
            --connect-timeout 20s \
            --errorformat long \
            --verbose \
            --test session.hurl
